[package]
name = "asset_registry"
version = "0.1.0"
description = "Mancipatio asset registry — issuers, assets, share classes, KYC (Faza 1)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "asset_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"
solana-sha256-hasher = "3.1.0"
# Same crate/version the transfer_hook program uses to build the
# ExtraAccountMetaList — `util::require_receiver_kyc_for_mint_to` sizes the
# list's Open shape with it (no crate dependency on the hook itself).
spl-tlv-account-resolution = "0.11.1"
solana-security-txt = "1.1.3"

[dev-dependencies]
# Host test VM. LiteSVM 0.15.x runs agave 4.1, which executes the final
# SBPF v3 (feature 5cC3foj77…, SIMD-0178/0189/0377) that this workspace
# builds and mainnet runs. LiteSVM 0.16 needs agave ^4.2.1, whose crates call
# `write_copy_of_slice` (rustc >= 1.93): that breaks the pinned 1.89.0 host
# toolchain here and in `anchor idl build` (it compiles dev-dependencies).
# The two agave caps keep the whole 4.x train (exact internal pins) on 4.1.
litesvm = "0.15.2"
agave-feature-set = "~4.1.2"
solana-program-runtime = "~4.1.2"
solana-clock = "3.1.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
spl-token-2022-interface = "3.0.0"
spl-associated-token-account-interface = "2.0.0"
# Parses the release .so the tests load (security.txt gate, design 8.3 §10).
solana-security-txt = { version = "1.1.3", features = ["parser"] }
# Host integration tests link both libraries; only the registry exports an
# entrypoint there. Normal SBF builds do not activate dev-dependency features.
transfer_hook = { path = "../transfer_hook", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
