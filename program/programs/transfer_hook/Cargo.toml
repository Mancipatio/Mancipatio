[package]
name = "transfer_hook"
version = "0.1.0"
description = "Mancipatio transfer hook — per-transfer blocklist / sanctions enforcement (Token-2022)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Incident artifact (design 8.3 §7.4): zero recovery delay and proposer-only
# cancel, for a COMPROMISED blocklist authority. Never a release / devnet / test build.
incident = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
spl-tlv-account-resolution = "0.11.1"
spl-transfer-hook-interface = "2.1.0"
spl-token-2022-interface = "2.1.0"
solana-security-txt = "1.1.3"

[dev-dependencies]
# Host test VM. LiteSVM 0.15.x runs agave 4.1, which executes the final
# SBPF v3 (feature 5cC3foj77…, SIMD-0178/0189/0377) that this workspace
# builds and mainnet runs. LiteSVM 0.16 needs agave ^4.2.1, whose crates call
# `write_copy_of_slice` (rustc >= 1.93): that breaks the pinned 1.89.0 host
# toolchain here and in `anchor idl build` (it compiles dev-dependencies).
# The two agave caps keep the whole 4.x train (exact internal pins) on 4.1.
litesvm = "0.15.2"
agave-feature-set = "~4.1.2"
solana-program-runtime = "~4.1.2"
spl-tlv-account-resolution = "0.11.1"
spl-transfer-hook-interface = "2.1.0"
spl-type-length-value = "0.9.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "4.3.0"
solana-clock = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
