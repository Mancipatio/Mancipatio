# Verifiable build and GitHub Release of both programs.
#
# Why CI and not the dev machine: the reproducible build needs Docker
# (solanafoundation/solana-verifiable-build image), which the dev Mac does not
# run. Ubuntu runners have it, so this workflow IS the canonical builder for
# release artifacts: the .so files it uploads are the bytes that go to
# mainnet, and anyone can re-run `solana-verify verify-from-repo` against the
# deployed program and this repository to reproduce the hash. The programs
# live in the program/ subdirectory of this monorepo, so pass
# `--mount-path program` to verify-from-repo.
#
# Base image is PINNED to the agave release the workspace targets (matches the
# local `solana-cli 3.1.13` toolchain). Bump it together with the toolchain —
# a different image produces a different (still valid) hash.
#
# Triggers:
# - a `v<digit>…` tag push: build, IDL drift check, then a GitHub Release
#   (tags that contain `-` are prereleases) with the .so files, both IDLs,
#   hashes.txt, sbf-sha256.txt and SHA256SUMS, plus build-provenance
#   attestations. The tagged commit must be on main. Turn on immutable
#   releases in the repository settings (D9).
# - manual (Run workflow), on any ref including a tag: build + IDL check; with
#   `dry_release` the release bundle is assembled exactly as for a tag and
#   uploaded as the 7-day workflow artifact release-dry-<sha>. A manual run
#   never publishes, attests or checks ancestry (those steps require a push
#   event).
#
# Artifacts: verifiable-programs-<sha> (90 days): target/deploy/*.so,
# hashes.txt, sbf-sha256.txt. The chain CLI (front/scripts/chain, runbook
# ops/runbook-mainnet.md) reads either the downloaded Release (flat layout,
# SHA256SUMS verified first) or this artifact (target/deploy layout).
name: Verifiable build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_release:
        description: Assemble the Release bundle as a workflow artifact (never published)
        type: boolean
        default: false
  push:
    tags: ["v[0-9]*"]

env:
  BASE_IMAGE: solanafoundation/solana-verifiable-build:3.1.13

defaults:
  run:
    working-directory: program

jobs:
  build:
    name: solana-verify build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.89.0

      # Release (tag) builds never restore a cache: the artifact comes from a
      # clean toolchain install only.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: program
          cache-targets: false # only ~/.cargo (solana-verify install), not target/

      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.1 --locked

      - name: Verifiable build — asset_registry
        run: solana-verify build --library-name asset_registry -b "$BASE_IMAGE"

      - name: Verifiable build — transfer_hook
        run: solana-verify build --library-name transfer_hook -b "$BASE_IMAGE"

      # The Docker build leaves target/ owned by root, so host cargo writes its
      # own build products elsewhere. The tests still include_bytes! the release
      # .so files from program/target/deploy (paths are source-relative).
      - name: Test the exact reproducible release artifacts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/host-target
        run: |
          sha256sum target/deploy/asset_registry.so target/deploy/transfer_hook.so > sbf-sha256.txt
          cargo test --workspace --locked --no-fail-fast
          sha256sum --check sbf-sha256.txt

      - name: Executable hashes
        run: |
          {
            echo "base image: $BASE_IMAGE"
            echo "commit: $GITHUB_SHA"
            echo -n "asset_registry: "
            solana-verify get-executable-hash target/deploy/asset_registry.so
            echo -n "transfer_hook: "
            solana-verify get-executable-hash target/deploy/transfer_hook.so
          } | tee hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: verifiable-programs-${{ github.sha }}
          path: |
            program/target/deploy/asset_registry.so
            program/target/deploy/transfer_hook.so
            program/hashes.txt
            program/sbf-sha256.txt
          retention-days: 90
          if-no-files-found: error

  # The same check as front-ci `program-drift`: the committed IDLs (which the
  # Release ships) are regenerated from program/ and both client layers match.
  idl-check:
    name: Program IDL + SDK drift
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: program
          cache-targets: false

      - name: Install pinned Anchor / Agave tooling
        working-directory: program
        run: bash scripts/install-ci-toolchain.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate Rust IDL from program/ and compare both client layers
        run: npm run check:idl -- --program-dir ../program

  # The bundle is assembled read-only, for a tag push and for a dry release
  # alike; only the tag-push `publish` job gets write, id-token and
  # attestation permissions.
  bundle:
    name: Release bundle
    needs: [build, idl-check]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: verifiable-programs-${{ github.sha }}
          path: art

      - name: Assemble the Release bundle
        run: |
          set -euo pipefail
          (cd art && sha256sum --check sbf-sha256.txt)
          mkdir dist
          cp art/target/deploy/*.so art/hashes.txt art/sbf-sha256.txt dist/
          cp front/idl/asset_registry.json front/idl/transfer_hook.json dist/
          grep -qx "commit: $GITHUB_SHA" dist/hashes.txt
          (cd dist && sha256sum *.so *.json hashes.txt sbf-sha256.txt > SHA256SUMS)
          cat dist/SHA256SUMS

      # A tag push hands the bundle to `publish`; a manual dry release keeps
      # it as release-dry-<sha> (never published).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && format('release-bundle-{0}', github.sha) || format('release-dry-{0}', github.sha) }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [bundle]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release tag must point at a commit that is already on main.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: dist

      - name: Re-check the bundle
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "Verifiable build of \`$GITHUB_SHA\` with \`$BASE_IMAGE\`."
            echo
            echo '```'
            cat dist/hashes.txt
            echo '```'
            echo
            echo "Check the files with \`sha256sum --check SHA256SUMS\` and"
            echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/verifiable-build.yml --source-ref $GITHUB_REF\`."
          } > "$RUNNER_TEMP/release-notes.txt"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "${prerelease[@]}"
