# Verifiable build and GitHub Release of both programs.
#
# Why CI and not the dev machine: the reproducible build needs Docker
# (solanafoundation/solana-verifiable-build image), which the dev Mac does not
# run. Ubuntu runners have it, so this workflow IS the canonical builder for
# release artifacts: the .so files it uploads are the bytes that go to
# mainnet, and anyone can re-run `solana-verify verify-from-repo` against the
# deployed program and this repository to reproduce the hash. The programs
# live in the program/ subdirectory of this monorepo, so pass
# `--mount-path program` to verify-from-repo.
#
# Base image is PINNED to the release train the workspace targets, by tag and
# by digest (BASE_IMAGE_DIGEST is checked before and after the builds): 4.2.2
# carries cargo-build-sbf 4.2.0 + platform-tools v1.56 (asserted below), the
# pair program-ci and scripts/build-sbf.sh use for SBPF v3. Bump both together
# with the toolchain — a different image produces a different (still valid)
# hash. `solana-verify verify-from-repo` must be given the same
# `--arch v3 -b <image>`.
# Every action is pinned to a commit SHA (the comment names its tag): this
# job holds id-token for the attestations.
#
# Incident artifacts (design 8.3 §7.4, O-12): the same source built with
# `--features incident` (zero recovery delay, proposer-only cancel) is built
# from the same image, gated, tested and hashed with EVERY release and ships
# in the Release as asset_registry-incident.so / transfer_hook-incident.so.
# They are deployed only in an incident (a COMPROMISED super admin /
# BlocklistAuthority), by the upgrade authority, and never get an OtterSec
# verify PDA; hashes.txt records their executable hashes.
#
# Triggers:
# - a `v<digit>…` tag push: build, IDL drift check, then a GitHub Release
#   (tags that contain `-` are prereleases) with the .so files (release and
#   incident), both IDLs, hashes.txt, sbf-sha256.txt and SHA256SUMS, plus
#   build-provenance attestations. The tagged commit must be on main. Turn on immutable
#   releases in the repository settings (D9).
# - manual (Run workflow), on any ref including a tag: build + IDL check; with
#   `dry_release` the release bundle is assembled exactly as for a tag and
#   uploaded as the 7-day workflow artifact release-dry-<sha>. A manual run
#   never publishes, attests or checks ancestry (those steps require a push
#   event).
#
# Artifacts: verifiable-programs-<sha> (90 days): target/deploy/*.so,
# target/deploy-incident/*.so, hashes.txt, sbf-sha256.txt. The chain CLI (front/scripts/chain, runbook
# ops/runbook-mainnet.md) reads either the downloaded Release (flat layout,
# SHA256SUMS verified first) or this artifact (target/deploy layout).
name: Verifiable build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_release:
        description: Assemble the Release bundle as a workflow artifact (never published)
        type: boolean
        default: false
  push:
    tags: ["v[0-9]*"]

env:
  BASE_IMAGE: solanafoundation/solana-verifiable-build:4.2.2
  # The image behind BASE_IMAGE, pinned (release-lanac-11). BASE_IMAGE keeps
  # the tag form on purpose: it is recorded in hashes.txt and must equal the
  # --base-image of the on-chain verify (scripts/chain/lib/squads.ts), so the
  # build input is unchanged. The digest check makes a moved tag fail the
  # build instead of silently changing the bytes. Docker Hub: 4.2.2 is a
  # single-arch (amd64) image whose only push was 2026-09-21. The rc.1
  # Release (SBPF v0) was built from 3.1.13 @ sha256:1a0ea3dd…. Bump both
  # together with the toolchain.
  BASE_IMAGE_DIGEST: sha256:16053d845922e798ab1852d3fe222faf5a23eeb1db3a13d30b70d6b6e82184ae

defaults:
  run:
    working-directory: program

jobs:
  build:
    name: solana-verify build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 branch (toolchain 1.89.0)

      # Release (tag) builds never restore a cache: the artifact comes from a
      # clean toolchain install only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          workspaces: program
          cache-targets: false # only ~/.cargo (solana-verify install), not target/

      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.1 --locked

      - name: Pull the base image and check its digest
        run: |
          docker pull "$BASE_IMAGE"
          digests="$(docker image inspect --format '{{join .RepoDigests " "}}' "$BASE_IMAGE")"
          echo "RepoDigests: $digests"
          case " $digests " in
            *"@${BASE_IMAGE_DIGEST} "*) echo "base image is $BASE_IMAGE_DIGEST" ;;
            *) echo "::error::$BASE_IMAGE is not $BASE_IMAGE_DIGEST (the tag moved): review the new image before bumping"; exit 1 ;;
          esac

      # The image's own tools build the release: they must be the pinned pair.
      - name: Base image carries cargo-build-sbf 4.2.0 / platform-tools v1.56
        run: |
          version="$(docker run --rm --entrypoint /bin/bash "$BASE_IMAGE" -c 'cargo build-sbf --version')"
          echo "$version"
          grep -qx "cargo-build-sbf 4.2.0" <<<"$version"
          grep -qx "platform-tools v1.56" <<<"$version"

      - name: Verifiable build — asset_registry
        run: solana-verify build --library-name asset_registry --arch v3 -b "$BASE_IMAGE"

      - name: Verifiable build — transfer_hook
        run: solana-verify build --library-name transfer_hook --arch v3 -b "$BASE_IMAGE"

      # The incident variants, from the same image and source (inside the
      # digest window below); cargo-build-sbf writes them to
      # target/deploy-incident, so the release bytes in target/deploy are
      # untouched (checked).
      #
      # --sbf-out-dir is ABSOLUTE (the container's mount point of program/):
      # with --library-name, solana-verify 0.5.1 runs cargo build-sbf with
      # `docker exec -w <workdir>/programs/<lib>/`, and cargo-build-sbf 4.2.0
      # joins a relative --sbf-out-dir to that directory, so a relative
      # `target/deploy-incident` would land in programs/<lib>/target/.
      # solana-verify prints the hash of target/deploy/<lib>.so after each
      # build: in this step that is the RELEASE artifact, not the incident one
      # (the incident hashes are printed below and in hashes.txt).
      - name: Verifiable build — incident artifacts
        run: |
          set -euo pipefail
          sha256sum target/deploy/asset_registry.so target/deploy/transfer_hook.so > "$RUNNER_TEMP/release-before-incident.txt"
          workdir="$(docker run --rm "$BASE_IMAGE" pwd)"
          case "$workdir" in
            /*) ;;
            *) echo "::error::the base image's working directory '$workdir' is not absolute"; exit 1 ;;
          esac
          if [[ "$workdir" =~ [[:space:]] ]]; then
            echo "::error::the base image's working directory '$workdir' contains whitespace (--cargo-build-sbf-args is split on whitespace)"
            exit 1
          fi
          rm -rf target/deploy-incident
          for lib in asset_registry transfer_hook; do
            solana-verify build --library-name "$lib" --arch v3 -b "$BASE_IMAGE" \
              --cargo-build-sbf-args="--features incident --sbf-out-dir $workdir/target/deploy-incident"
          done
          sha256sum --check "$RUNNER_TEMP/release-before-incident.txt"
          # A missing artifact must fail here: cmp -s returns 2 for a missing
          # file, which the equality guard below would read as "differs".
          for lib in asset_registry transfer_hook; do
            if [[ ! -s "target/deploy-incident/$lib.so" ]]; then
              echo "::error::$lib: target/deploy-incident/$lib.so was not written (check --sbf-out-dir)"
              ls -la target/deploy-incident programs/*/target 2>/dev/null || true
              exit 1
            fi
          done
          echo "incident artifacts (sha256):"
          sha256sum target/deploy-incident/asset_registry.so target/deploy-incident/transfer_hook.so
          for lib in asset_registry transfer_hook; do
            if cmp -s "target/deploy/$lib.so" "target/deploy-incident/$lib.so"; then
              echo "::error::$lib: the incident artifact equals the release artifact (--features incident did not apply)"
              exit 1
            fi
          done

      # The builds used whatever the tag names locally: still the pinned image?
      - name: Check the base image digest after the builds
        run: |
          case " $(docker image inspect --format '{{join .RepoDigests " "}}' "$BASE_IMAGE") " in
            *"@${BASE_IMAGE_DIGEST} "*) echo "base image is still $BASE_IMAGE_DIGEST" ;;
            *) echo "::error::$BASE_IMAGE changed during the build"; exit 1 ;;
          esac

      # Before any test: the release bytes are SBPF v3 with no dynamic
      # symbol, every call resolved and one security.txt (design 8.3 §11.3).
      - name: SBPF v3 ELF + symbol + security.txt gate
        run: bash scripts/check-sbf-elf.sh target/deploy/asset_registry.so target/deploy/transfer_hook.so target/deploy-incident/asset_registry.so target/deploy-incident/transfer_hook.so

      # ... and the gate still rejects patched copies of these exact bytes.
      - name: ELF gate negative control
        run: bash scripts/check-sbf-elf-selftest.sh target/deploy/asset_registry.so target/deploy/transfer_hook.so

      # The Docker build leaves target/ owned by root, so host cargo writes its
      # own build products elsewhere. The tests still include_bytes! the release
      # .so files from program/target/deploy (paths are source-relative).
      # MANCI_REQUIRE_INCIDENT=1: test_incident_build runs against the
      # incident artifacts above and fails if they are missing.
      - name: Test the exact reproducible release artifacts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/host-target
          MANCI_REQUIRE_INCIDENT: "1"
        run: |
          sha256sum target/deploy/asset_registry.so target/deploy/transfer_hook.so target/deploy-incident/asset_registry.so target/deploy-incident/transfer_hook.so > sbf-sha256.txt
          cargo test --workspace --locked --no-fail-fast
          sha256sum --check sbf-sha256.txt

      # `arch: v3`: the on-chain verify (solana-verify verify-from-repo, the
      # OtterSec PDA) must pass `--arch v3 -b <base image>`; the default v0
      # does not reproduce these hashes.
      - name: Executable hashes
        run: |
          {
            echo "base image: $BASE_IMAGE"
            echo "base image digest: $BASE_IMAGE_DIGEST"
            echo "arch: v3"
            echo "commit: $GITHUB_SHA"
            echo -n "asset_registry: "
            solana-verify get-executable-hash target/deploy/asset_registry.so
            echo -n "transfer_hook: "
            solana-verify get-executable-hash target/deploy/transfer_hook.so
            echo -n "asset_registry-incident: "
            solana-verify get-executable-hash target/deploy-incident/asset_registry.so
            echo -n "transfer_hook-incident: "
            solana-verify get-executable-hash target/deploy-incident/transfer_hook.so
          } | tee hashes.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifiable-programs-${{ github.sha }}
          path: |
            program/target/deploy/asset_registry.so
            program/target/deploy/transfer_hook.so
            program/target/deploy-incident/asset_registry.so
            program/target/deploy-incident/transfer_hook.so
            program/hashes.txt
            program/sbf-sha256.txt
          retention-days: 90
          if-no-files-found: error

  # The same check as front-ci `program-drift`: the committed IDLs (which the
  # Release ships) are regenerated from program/ and both client layers match.
  idl-check:
    name: Program IDL + SDK drift
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 branch (toolchain 1.89.0)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          workspaces: program
          cache-targets: false

      # The IDL build needs Anchor and the host compiler only (no SBF build).
      - name: Install pinned Anchor / Agave tooling
        working-directory: program
        run: bash scripts/install-ci-toolchain.sh --idl-only

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate Rust IDL from program/ and compare both client layers
        run: npm run check:idl -- --program-dir ../program

  # The bundle is assembled read-only, for a tag push and for a dry release
  # alike; only the tag-push `publish` job gets write, id-token and
  # attestation permissions.
  bundle:
    name: Release bundle
    needs: [build, idl-check]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verifiable-programs-${{ github.sha }}
          path: art

      - name: Assemble the Release bundle
        run: |
          set -euo pipefail
          (cd art && sha256sum --check sbf-sha256.txt)
          mkdir dist
          cp art/target/deploy/*.so art/hashes.txt art/sbf-sha256.txt dist/
          for lib in asset_registry transfer_hook; do
            cp "art/target/deploy-incident/$lib.so" "dist/$lib-incident.so"
          done
          cp front/idl/asset_registry.json front/idl/transfer_hook.json dist/
          grep -qx "commit: $GITHUB_SHA" dist/hashes.txt
          grep -qx "arch: v3" dist/hashes.txt
          (cd dist && sha256sum -- *.so *.json hashes.txt sbf-sha256.txt > SHA256SUMS)
          cat dist/SHA256SUMS

      # A tag push hands the bundle to `publish`; a manual dry release keeps
      # it as release-dry-<sha> (never published).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event_name == 'push' && format('release-bundle-{0}', github.sha) || format('release-dry-{0}', github.sha) }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [bundle]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release tag must point at a commit that is already on main.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ github.sha }}
          path: dist

      - name: Re-check the bundle
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "Verifiable build of \`$GITHUB_SHA\` with \`$BASE_IMAGE\`."
            echo
            echo '```'
            cat dist/hashes.txt
            echo '```'
            echo
            echo "Check the files with \`sha256sum --check SHA256SUMS\` and"
            echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/verifiable-build.yml --source-ref $GITHUB_REF\`."
          } > "$RUNNER_TEMP/release-notes.txt"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            "${prerelease[@]}"
