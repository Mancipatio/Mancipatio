# Front CI — typecheck, lint, unit tests, a production build (plus a Deno
# type-check of the Supabase edge function), the mainnet variant of the
# build with placeholder values, the Playwright UI smoke over a localnet and
# the mainnet build, a dependency audit and program IDL/SDK drift for front/.
# The builds run without deployment secrets, so a merge that
# would break the Vercel build is caught here first. The drift job also
# watches program/ because the client SDK in front/lib/generated is derived
# from the program source.
#
# Every action is pinned to a commit SHA (release-lanac-11, ops-qa-11; the
# comment names the tag it was resolved from). Dependabot proposes the bumps
# (.github/dependabot.yml).
name: Front CI

on:
  push:
    branches: [main]
    paths:
      - "front/**"
      - "program/**"
      - ".github/workflows/front-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "front/**"
      - "program/**"
      - ".github/workflows/front-ci.yml"
  # Weekly, so a newly published advisory against an unchanged lockfile is
  # seen. Only the audit job runs on the schedule.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # The weekly scheduled audit never cancels (or is cancelled by) a push run.
  group: front-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: front

jobs:
  check:
    name: tsc + eslint + vitest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # PostgreSQL 17, the major version of the Supabase projects (devnet
      # `show server_version` 17.6, supabase/config.toml major_version 17;
      # podaci-infra-5). Ubuntu 24.04 ships 16 only: PGDG's apt repository.
      - name: Install local PostgreSQL 17 integration tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17

      - name: Unit tests and isolated PostgreSQL regressions
        env:
          RUN_LOCAL_POSTGRES_TESTS: '1'
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: npm run test

      - name: Check generated SDK against committed IDL
        run: npm run check:codegen

  build:
    name: next build (no secrets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_NETWORK: devnet
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npx next build

      # The Supabase edge function (Deno) is outside tsc and eslint; type-check
      # it against its own import map before anyone deploys it.
      - name: Type-check the helius-webhook edge function (Deno)
        run: npm run check:edge

  # front-app-18: the mainnet guards refuse without their settings, pass with
  # placeholders (and an invented fixture of the lib/legal/ slots, written into
  # the runner's checkout only), and the mainnet branches compile. No secret
  # is involved.
  build-mainnet:
    name: next build (mainnet, placeholder env)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mainnet guards and build
        run: bash scripts/ci/mainnet-build.sh

      # ops-qa-5: the UI smoke over the mainnet build just made (CI keeps its
      # .next/): every page, the admin wallet gate, no "devnet" wording.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      - name: UI smoke over the mainnet build
        timeout-minutes: 10
        env:
          UI_SMOKE_NETWORK: mainnet
        run: npm run ui-smoke

      - name: Keep the smoke report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-smoke-mainnet
          path: |
            front/ui-smoke/.report
            front/ui-smoke/.results
          retention-days: 7
          if-no-files-found: ignore

  # ops-qa-5 (plan 6.5): the Playwright UI smoke (front/ui-smoke/,
  # ops/ui-smoke.md) over a production build with placeholder settings: a
  # localnet build whose RPC, PubSub and Supabase hosts do not exist and are
  # answered by the tests; a mock Wallet Standard wallet signs with a test key.
  # Every page, the SIWS session sign-in, the admin role gate, the sale page's
  # pause / proceeds-freeze / geoblock gates. Nothing leaves the runner.
  ui-smoke:
    name: UI smoke (Playwright, localnet placeholder build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install the browser's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      - name: Production build (localnet, placeholder settings)
        run: npm run ui-smoke:build

      - name: UI smoke
        timeout-minutes: 10
        run: npm run ui-smoke

      - name: Keep the smoke report of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-smoke-localnet
          path: |
            front/ui-smoke/.report
            front/ui-smoke/.results
          retention-days: 7
          if-no-files-found: ignore

  # front-app-16 / ops-qa-14: no HIGH (or critical) advisory in the production
  # dependency tree, nor in the chain:emergency Ledger packages. Dev-only
  # advisories are left to Dependabot.
  audit:
    name: npm audit (production, high)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2

      - name: Audit the production dependencies (lockfile)
        run: npm audit --omit=dev --audit-level=high

      # The pinned Ledger packages chain:emergency signs with, on the operator
      # machine (npm ci --ignore-scripts): a lockfile of its own, no dev
      # dependencies.
      - name: Audit the chain:emergency Ledger packages (lockfile)
        working-directory: front/scripts/chain/ledger
        run: npm audit --audit-level=high

  program-drift:
    name: Program IDL + SDK drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 branch (toolchain 1.89.0)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: program
          cache-targets: false

      # The IDL build needs Anchor and the host compiler only (no SBF build,
      # so no cargo-build-sbf 4.2.0 compile; design 8.3 §11.1.6).
      - name: Install pinned Anchor / Agave tooling
        working-directory: program
        run: bash scripts/install-ci-toolchain.sh --idl-only

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate Rust IDL from program/ and compare both client layers
        run: npm run check:idl -- --program-dir ../program
