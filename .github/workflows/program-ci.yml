# Program CI — fresh SBF build, tests and IDL generation for program/, and a
# RustSec audit of program/Cargo.lock. Actions are pinned to commit SHAs (the
# comment names the tag they were resolved from).
name: Program CI

on:
  push:
    branches: [main]
    paths:
      - "program/**"
      - ".github/workflows/program-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "program/**"
      - ".github/workflows/program-ci.yml"
  # Weekly, so a newly published advisory against an unchanged Cargo.lock is
  # seen. Only the audit job runs on the schedule.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  # The weekly scheduled audit never cancels (or is cancelled by) a push run.
  group: program-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: program

jobs:
  # release-lanac-12 / ops-qa-14: RustSec advisories (vulnerabilities and
  # yanked crates) against the Cargo.lock the verifiable build uses. Warnings
  # (unmaintained, unsound) are printed, not fatal; a vulnerability fails.
  # cargo-audit itself is installed at a pinned version with its own lockfile.
  # Baseline 2026-09-28 after LiteSVM 0.15.2 (cargo-audit 0.22.2, 1271
  # advisories, 414 crates): 0 vulnerabilities, so no --ignore; 6 warnings,
  # all transitive through the Solana/Anchor/LiteSVM stack: unmaintained
  # ansi_term (RUSTSEC-2021-0139, litesvm), bincode 1.3 (RUSTSEC-2025-0141),
  # derivative (RUSTSEC-2024-0388) and paste (RUSTSEC-2024-0436) via
  # solana-bn254/poseidon, libsecp256k1 0.7 (RUSTSEC-2025-0161,
  # solana-syscalls 4.1 under litesvm); unsound anyhow Error::downcast_mut (RUSTSEC-2026-0190,
  # anchor build-time crates). (LiteSVM 0.10 also pulled rand 0.7,
  # RUSTSEC-2026-0097: gone.) An ignore added later names its advisory and
  # why here, never a blanket flag.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 branch (toolchain 1.89.0)

      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit program/Cargo.lock
        run: cargo audit --file Cargo.lock

  check:
    name: Fresh SBF build + tests + IDL
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 branch (toolchain 1.89.0)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: program
          # Reuse downloaded Cargo dependencies, never a prior deploy artifact.
          cache-targets: false

      # cargo-build-sbf 4.x has no release binaries: install-ci-toolchain.sh
      # builds it from crates.io (--locked) into this directory, so cache it
      # by version. Only the tool is cached, never a program artifact.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/mancipatio-solana-toolchain/cbs
          key: cargo-build-sbf-4.2.0-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned Anchor / Agave / cargo-build-sbf tooling
        run: bash scripts/install-ci-toolchain.sh

      - name: Format check
        run: cargo fmt --all --check

      # SBPF v3 (design 8.3 §11.2): platform-tools v1.56 only — never
      # `--arch v3` with v1.52/v1.53. cargo-build-sbf 4.2.0 links v3 with
      # `-z defs`, so an unresolved symbol already fails here; the ELF gate
      # below proves it independently on the artifact.
      - name: Build both SBF programs (SBPF v3)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          cargo build-sbf --workspace --arch v3 --tools-version v1.56 -- --locked 2>&1 | tee target/build-sbf.log

      - name: No stack-frame overflow
        run: |
          test -s target/build-sbf.log
          if grep -E "Stack offset of [0-9]+ exceeded|exceeded max offset" target/build-sbf.log; then
            echo "::error::a function exceeds the SBF stack frame: Box the offending accounts"
            exit 1
          fi

      - name: SBPF v3 ELF + symbol + security.txt gate
        run: bash scripts/check-sbf-elf.sh target/deploy/asset_registry.so target/deploy/transfer_hook.so

      # The gate replaces cargo-build-sbf's skipped check_undefined_symbols:
      # it must PASS the real artifacts and FAIL patched copies of them (v0
      # e_flags, an unknown syscall hash, a call outside .text, 0 or 2
      # security.txt markers), or a parser bug could wave everything through.
      - name: ELF gate negative control
        run: bash scripts/check-sbf-elf-selftest.sh target/deploy/asset_registry.so target/deploy/transfer_hook.so

      # ProgramData capacity of the deployed asset_registry: an upgrade larger
      # than this needs `solana program extend` first. SBPF v3 shrank the
      # rc.1 logic from 2,469,512 B (v0) to 2,044,248 B. Devnet capacity is
      # 2,537,208 B: 2,471,672 (2C-2) + the 65,536 B extend of the 2C-4
      # rollout. Evidence, `solana program show FJs1EM1N… -u devnet` at
      # 2026-09-23T22:09Z (slot 503104632), saved as
      # docs/mainnet-readiness/deploy-2C4/post-show-registry.txt:
      #   Data Length: 2537208 (0x26b6f8) bytes
      # Any other cluster must be extended to at least this before an upgrade.
      - name: asset_registry size budget
        env:
          ASSET_REGISTRY_CAPACITY: "2537208"
        run: |
          size=$(wc -c < target/deploy/asset_registry.so | tr -d ' ')
          headroom=$((ASSET_REGISTRY_CAPACITY - size))
          echo "asset_registry.so: ${size} B, capacity ${ASSET_REGISTRY_CAPACITY} B, headroom ${headroom} B"
          if [ "$size" -gt "$ASSET_REGISTRY_CAPACITY" ]; then
            echo "::error::asset_registry.so (${size} B) exceeds the deployed ProgramData capacity (${ASSET_REGISTRY_CAPACITY} B): extend the program first"
            exit 1
          fi
          if [ "$headroom" -lt 8192 ]; then
            echo "::warning::asset_registry.so is within 8 KiB of the ProgramData capacity (${headroom} B left): plan solana program extend"
          fi

      # ProgramData capacity of the deployed transfer_hook (devnet `solana
      # program show` before 2A: 392,712 B; no hook extend since). SBPF v3
      # shrank the rc.1 hook from 390,152 B (v0) to 338,560 B.
      - name: transfer_hook size budget
        env:
          TRANSFER_HOOK_CAPACITY: "392712"
        run: |
          size=$(wc -c < target/deploy/transfer_hook.so | tr -d ' ')
          headroom=$((TRANSFER_HOOK_CAPACITY - size))
          echo "transfer_hook.so: ${size} B, capacity ${TRANSFER_HOOK_CAPACITY} B, headroom ${headroom} B"
          if [ "$size" -gt "$TRANSFER_HOOK_CAPACITY" ]; then
            echo "::error::transfer_hook.so (${size} B) exceeds the deployed ProgramData capacity (${TRANSFER_HOOK_CAPACITY} B): extend the program first"
            exit 1
          fi
          if [ "$headroom" -lt 2048 ]; then
            echo "::warning::transfer_hook.so is within 2 KiB of the ProgramData capacity (${headroom} B left): plan solana program extend"
          fi

      - name: Test the freshly built artifacts
        run: cargo test --workspace --locked

      # After build-sbf: the LiteSVM tests include_bytes! the fresh .so files.
      # too_many_arguments is the Anchor handler shape and diverging_sub_expression
      # comes from the #[program] expansion; everything else is denied.
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::diverging_sub_expression

      - name: Generate IDL from source with the pinned host compiler
        run: |
          mkdir -p target/idl
          anchor idl build -p asset_registry -o "$PWD/target/idl/asset_registry.json" -- --locked --lib
          anchor idl build -p transfer_hook -o "$PWD/target/idl/transfer_hook.json" -- --locked --lib

      - name: Record tested artifact identity
        run: |
          {
            printf 'commit: %s\n' "$GITHUB_SHA"
            rustc --version
            solana --version
            cargo build-sbf --version
            anchor --version
            bash scripts/check-sbf-elf.sh target/deploy/asset_registry.so target/deploy/transfer_hook.so
            sha256sum target/deploy/asset_registry.so target/deploy/transfer_hook.so target/idl/asset_registry.json target/idl/transfer_hook.json
            wc -c target/deploy/asset_registry.so target/deploy/transfer_hook.so
          } > target/tested-artifacts.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-programs-${{ github.sha }}
          path: |
            program/target/deploy/asset_registry.so
            program/target/deploy/transfer_hook.so
            program/target/idl/asset_registry.json
            program/target/idl/transfer_hook.json
            program/target/tested-artifacts.txt
          if-no-files-found: error
